<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let clickCount = 0;

        function incrementClickCount() {
            clickCount++;
            document.getElementById('clickCount').innerText = 'Click count: ' + clickCount;
            if (clickCount === 10) {
                alert('You have clicked the button 10 times! nice that you got started but still 9000 more clicks to go!');
            }
            if (clickCount === 100) {
                alert('You have clicked the button 100 times! atlease that 10 percent of the way to 10000 clicks! but 100 still small so try harder');
            }
            if (clickCount === 200) {
                alert('You have clicked the button 200 times! and you are still not even 1/50 of the way to 10000 clicks! keep going!');
            }
            if (clickCount === 500) {
                alert('you clicked the button 500 times! now were starting to get somewhere but still 9500 more clicks to go! keep going!');
            }
            if (clickCount === 1000) {
                alert('You have clicked the button 1000 times! now you are 1/10 of the way to 10000 clicks! keep going and you will get there!');
            }
            if (clickCount === 2000) {
                alert('not trying to be mean but you have clicked the button 2000 times and there 8000 more clicks to go! so pick up the pace and click faster!');
            }if (clickCount === 5000) {
                alert('You have clicked the button 5000 times! you are a clicking machine! your already halfway to 10000 clicks!');
            }
            if (clickCount === 10000) {
                alert('here time for the secret message since you reach 10000 clicks! go outside and touch grass! why did you click a button 10000 times?   ');
            }
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.05);
            transition: transform 0.3s;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Button Clicker where the more you click you unlock secret messages and the goal is to click 10000 times!</h1>
    <button onclick="incrementClickCount()" id="clickButton">Click Me!</button>
    <p id="clickCount">Click count: 0</p>
    
</body>
</html>
